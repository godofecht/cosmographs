name: Build and deploy repository universe

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build self-hosted app
        run: |
          npm install --no-audit --no-fund
          npm run build
          python3 generate.py --public-only --out dist/data
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/data/nodes.csv
          test -s dist/data/links.csv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Check whether GitHub Pages is enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "### Site build passed; GitHub Pages is not enabled yet" >> "$GITHUB_STEP_SUMMARY"
              echo "Enable Settings → Pages → Source: GitHub Actions. The next push or manual run will deploy this already-tested site." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages API status: $status" >&2
              exit 1
              ;;
          esac

      - name: Publish build probe
        if: always()
        shell: bash
        env:
          PAGES_ENABLED: ${{ steps.pages.outputs.enabled }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin ci-status
          git worktree add /tmp/ci-status origin/ci-status
          cat > /tmp/ci-status/ci-status.json <<EOF
          {"sha":"${GITHUB_SHA}","run_id":"${GITHUB_RUN_ID}","build":"${BUILD_STATUS}","pages_enabled":"${PAGES_ENABLED:-unknown}","deploy":"pending"}
          EOF
          git -C /tmp/ci-status add ci-status.json
          git -C /tmp/ci-status commit -m "Record build status ${GITHUB_RUN_ID}" || true
          git -C /tmp/ci-status push origin HEAD:ci-status

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for deployment probe
        if: always()
        uses: actions/checkout@v6

      - name: Publish deployment probe
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin ci-status
          git worktree add /tmp/ci-status origin/ci-status
          cat > /tmp/ci-status/ci-status.json <<EOF
          {"sha":"${GITHUB_SHA}","run_id":"${GITHUB_RUN_ID}","build":"success","pages_enabled":"true","deploy":"${DEPLOY_STATUS}","page_url":"${PAGE_URL}"}
          EOF
          git -C /tmp/ci-status add ci-status.json
          git -C /tmp/ci-status commit -m "Record deployment status ${GITHUB_RUN_ID}" || true
          git -C /tmp/ci-status push origin HEAD:ci-status
