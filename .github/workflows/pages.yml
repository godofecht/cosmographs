name: Build and deploy repository universe

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build self-hosted app
        run: |
          npm install --no-audit --no-fund
          npm run build
          python3 generate.py --public-only --out dist/data
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/data/nodes.csv
          test -s dist/data/links.csv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Pages deployment status
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin ci-status
          git worktree add /tmp/ci-status origin/ci-status
          printf '{"sha":"%s","run_id":"%s","deploy":"%s","page_url":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOY_STATUS" "$PAGE_URL" \
            > /tmp/ci-status/ci-status.json
          git -C /tmp/ci-status add ci-status.json
          git -C /tmp/ci-status commit -m "Record Pages status ${GITHUB_RUN_ID}" || true
          git -C /tmp/ci-status push origin HEAD:ci-status
